<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: "Courier New", Courier, monospace;
            margin: 0;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-sizing: border-box;
            position: relative;
        }

   
        #gatekeeper {
            text-align: center;
            max-width: 600px;
            z-index: 10;
        }

        .fun-btn {
            background-color: #00ff00;
            color: #000000;
            border: none;
            padding: 20px 40px;
            font-size: 2.5rem;
            font-family: 'Impact', sans-serif;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px #00ff00;
            border-radius: 5px;
            transition: transform 0.1s;
        }

        .fun-btn:hover {
            transform: scale(1.05);
            background-color: #33ff33;
        }

        .disclaimer-text {
            margin-top: 25px;
            font-size: 0.85rem;
            color: #666666;
            line-height: 1.4;
        }

        
        .chaos-mode {
            animation: flash 0.15s infinite;
        }

        @keyframes flash {
            0% { background-color: #111; }
            50% { background-color: #fff; }
            100% { background-color: #000; }
        }

        .virus-text {
            font-size: 8vw;
            font-family: "Impact", sans-serif;
            text-align: center;
            line-height: 1;
            letter-spacing: 2px;
            transform: rotate(-5deg);
            display: none;
            text-shadow: 0 0 20px currentColor; /* Pulls from the dynamic JS color */
            transition: color 0.2s ease;
        }

        .sub-text {
            font-size: 3vw;
            margin-top: 20px;
            font-family: monospace;
            background: #000;
            color: #fff;
            padding: 10px;
            display: none;
        }

     
        #exit-trap {
            position: absolute;
            bottom: 20px;
            right: 20px;
            text-align: center;
            display: none;
            z-index: 100;
        }

        .exit-btn {
            background: #ff0000;
            color: #fff;
            border: 2px solid #fff;
            padding: 10px 20px;
            font-weight: bold;
            font-family: Arial, sans-serif;
            cursor: pointer;
            box-shadow: 0 0 10px #ff0000;
        }

        .exit-btn:hover {
            background: #cc0000;
        }

        .fake-text {
            font-size: 0.6rem;
            color: #888;
            margin-top: 4px;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div id="gatekeeper">
        <button class="fun-btn" onclick="startChaos()">Click me for fun! :-))))</button>
        <div class="disclaimer-text" id="disclaimer-target">...</div>
    </div>

    <div class="virus-text" id="target">...</div>
    <div class="sub-text" id="sub-target">YOU ARE AN IDIOT! :-) :-) :-)</div>

    <div id="exit-trap">
        <button class="exit-btn" onclick="triggerLevel2()">EXIT</button>
        <div class="fake-text">(not exit)</div>
    </div>

    <script>
      
        let hostname = window.location.hostname.replace('www.', '').toUpperCase();
        
      
        document.getElementById('target').innerText = `${hostname} IS INFECTED!`;
        document.getElementById('disclaimer-target').innerText = `DISCLAIMER: By clicking the button above, you agree to enter a joke website for ${hostname}. This will trigger browser artifacts, flashing lights, and interactive layout changes. Proceed at your own risk!`;
        document.title = `Welcome to ${hostname}`;

       
        function generateDomainColor(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            let h = Math.abs(hash % 360);
            return `hsl(${h}, 100%, 50%)`; 
        }

       
        const virusColor = generateDomainColor(hostname);
        document.getElementById('target').style.color = virusColor;


    
        function startChaos() {
          
            document.getElementById('gatekeeper').style.display = 'none';

            // Paint the virus graphics and fake layout exit
            document.getElementById('target').style.display = 'block';
            document.getElementById('sub-target').style.display = 'block';
            document.getElementById('exit-trap').style.display = 'block';

           
            document.title = `YOU ARE AN IDIOT - ${hostname}`;
            document.body.classList.add('chaos-mode');

          
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            }
        }



        function triggerLevel2() {
        
            document.title = `YOU ARE AN IDIOT #2 - ${hostname} B-)`;
            document.getElementById('target').innerText = `WELCOME TO LEVEL 2!`;
            document.getElementById('target').style.color = '#ff00ff'; // 
            document.getElementById('sub-target').innerText = `THERE IS NO ESCAPE! B-) B-) B-)`;
            document.getElementById('exit-trap').style.display = 'none';


            setTimeout(function() {
                
                
                function unbreakableAlert() {
                    alert(`WELCOME TO YOU ARE AN IDIOT #2!\n\nThere is no escape from ${hostname}! B-)`);
                    
                   
                    setTimeout(unbreakableAlert, 0);
                }

                // Snap the trap shut
                unbreakableAlert();

            }, 100); 
        }
    </script>
</body>
</html>
