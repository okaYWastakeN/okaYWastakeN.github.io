<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome</title>
    <style>
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Arial", sans-serif;
            margin: 0;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-sizing: border-box;
            position: relative;
        }

        /* --- GATEKEEPER START --- */
        #gatekeeper {
            text-align: center;
            max-width: 600px;
            z-index: 10;
        }

        .fun-btn {
            background-color: #ffffff;
            color: #000000;
            border: 4px solid #000000;
            padding: 20px 40px;
            font-size: 2.5rem;
            font-family: "Arial Black", sans-serif;
            font-weight: bold;
            cursor: pointer;
        }

        .fun-btn:hover {
            background-color: #000000;
            color: #ffffff;
        }

        .disclaimer-text {
            margin-top: 25px;
            font-size: 0.85rem;
            color: #555555;
            line-height: 1.4;
        }

        /* --- THE ORIGINAL FLASHING STYLE --- */
        .chaos-mode {
            animation: flash 0.15s infinite;
        }

        @keyframes flash {
            0% { background-color: #ffffff; color: #000000; }
            50% { background-color: #000000; color: #ffffff; }
            100% { background-color: #ffffff; color: #000000; }
        }

        .virus-text {
            font-size: 7vw;
            font-family: "Arial Black", sans-serif;
            font-weight: 900;
            text-align: center;
            line-height: 1.1;
            letter-spacing: -1px;
            display: none;
        }

        /* --- CORNER EXIT TRAP --- */
        #exit-trap {
            position: absolute;
            bottom: 20px;
            right: 20px;
            text-align: center;
            display: none;
            z-index: 100;
        }

        .exit-btn {
            background: #ffffff;
            color: #000000;
            border: 2px solid #000000;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .fake-text {
            font-size: 0.6rem;
            margin-top: 4px;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div id="gatekeeper">
        <button class="fun-btn" onclick="startChaos()">Click me for fun! :-))))</button>
        <div class="disclaimer-text" id="disclaimer-target">...</div>
    </div>

    <div class="virus-text" id="target">...</div>

    <div id="exit-trap">
        <button class="exit-btn" onclick="triggerLevel2()">EXIT</button>
        <div class="fake-text">(not exit)</div>
    </div>

    <script>
        let hostname = window.location.hostname.replace('www.', '').toUpperCase();
        
        document.getElementById('disclaimer-target').innerText = `DISCLAIMER: By clicking the button above, you agree to enter a joke website for ${hostname}. This will trigger browser artifacts, flashing loops, and interactive elements. Proceed at your own risk!`;
        document.title = `Welcome to ${hostname}`;

        // Handles the level 1 flashing state layout swap
        function startChaos() {
            document.getElementById('gatekeeper').style.display = 'none';
            document.getElementById('target').innerText = `YOU ARE AN IDIOT!\n:-) :-) :-)`;
            document.getElementById('target').style.display = 'block';
            document.getElementById('exit-trap').style.display = 'block';

            document.title = `YOU ARE AN IDIOT - ${hostname}`;
            document.body.classList.add('chaos-mode');

            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            }
        }

        // Handles the asynchronous execution block to allow rendering before the popup trap
        function triggerLevel2() {
            document.title = `YOU ARE AN IDIOT #2 - ${hostname} B-)`;
            document.getElementById('target').innerText = `YOU ARE AN IDIOT #2!\nB-) B-) B-)`;
            document.getElementById('exit-trap').style.display = 'none';

            setTimeout(function() {
                function unbreakableAlert() {
                    alert(`WELCOME TO YOU ARE AN IDIOT #2!\n\nThere is no escape from ${hostname}! B-)`);
                    setTimeout(unbreakableAlert, 0);
                }
                unbreakableAlert();
            }, 100); 
        }
    </script>
</body>
</html>
